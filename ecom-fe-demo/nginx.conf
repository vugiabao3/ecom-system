server {
    listen 80;

    server_name localhost;

    root /usr/share/nginx/html;

    index index.html;

    # React application
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}